<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadow Royale</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10173a;--ring:#1b2556;--red:#e8392f;--blue:#2f7bff;--gold:#f5c542;--paper:#f6efe0;--mut:#9aa6d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:repeating-linear-gradient(90deg,#10173a 0 46px,#121b42 46px 92px);color:var(--paper);font-family:'Chakra Petch',system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
#app{max-width:640px;margin:0 auto;padding:14px 0 40px}
.big,h1,h2,button,.role,.ov{font-family:Bungee,Impact,sans-serif;font-weight:400}
h1{font-size:clamp(48px,15vw,88px);line-height:.88;margin:18px 0 8px;color:var(--gold);text-shadow:4px 4px 0 var(--red)}
h2{font-size:22px;margin:0 0 10px}
p{color:var(--mut);margin:0 0 14px}
.card{background:var(--ring);border:3px solid var(--paper);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:6px 6px 0 #0006}
input{width:100%;font:700 18px 'Chakra Petch',sans-serif;padding:12px;border:3px solid var(--paper);background:var(--bg);color:var(--paper);border-radius:4px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:4px;padding:13px 16px;font-size:16px;color:#fff;background:var(--blue);touch-action:manipulation;box-shadow:0 4px 0 #0008}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
button.red{background:var(--red)}button.gold{background:var(--gold);color:#1a1200}button.ghost{background:#2b3770}
button:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.or{text-align:center;color:var(--mut);margin:12px 0}
.err{color:#ff8b82;font-weight:700;margin-top:8px}
.code{font-size:56px;letter-spacing:6px;color:var(--gold);text-align:center;margin:4px 0}
.pl{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:2px dashed #ffffff22;font-weight:700}
.pl small{color:var(--mut);font-weight:500}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:700}
.stage{height:96px;border-radius:8px;margin-bottom:10px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 18% 0,#f5c54277,transparent 45%),radial-gradient(ellipse at 82% 0,#2f7bff88,transparent 45%),#0a1030;border:3px solid var(--paper)}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:46px;background:radial-gradient(circle at 12px 30px,#26357f 0 11px,transparent 12px) 0 0/26px 40px repeat-x,radial-gradient(circle at 25px 42px,#141d4d 0 12px,transparent 13px) 0 0/26px 40px repeat-x}
.stage .big{position:absolute;inset:14px 0 0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold);text-shadow:3px 3px 0 var(--red);z-index:1}
.stage small{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:700;z-index:1;padding:0 8px}
.m{background:var(--ring);border:3px solid var(--paper);border-radius:6px;margin-bottom:10px;overflow:hidden}
.m.mine{border-color:var(--gold);box-shadow:0 0 0 3px #f5c54255}
.side{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 12px}
.side+.side{border-top:3px solid var(--bg)}
.side .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.side .nm small{color:var(--mut);font-weight:500}
.side .pts{font-size:30px;display:flex;gap:8px;align-items:center}
.side.win{background:#f5c54226}.side.win .nm::before{content:"\1F451 "}
.side.lose{opacity:.45}.side.me .nm{color:var(--gold)}
.mid{text-align:center;padding:6px 12px;font-weight:700;border-top:3px solid var(--bg);background:#0a1030}
.hist{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;font-size:13px;border-top:3px solid var(--bg)}
.hist span{background:var(--bg);padding:2px 6px;border-radius:4px}.hist .x{opacity:.5}.hist .o{outline:1px solid var(--gold)}
.f{width:48px;height:48px;flex:none}.f.big{width:120px;height:120px}
.sm{padding:6px 9px;font-size:12px}.sm.on{background:var(--gold);color:#1a1200}
.bye{padding:8px 12px;border:3px dashed var(--mut);border-radius:6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#pad{margin-top:14px;text-align:center}
.role{padding:10px;border-radius:6px;margin-bottom:8px;font-size:14px}.role.att{background:var(--red)}.role.def{background:var(--blue)}
.tl{height:10px;background:var(--bg);border-radius:5px;margin:8px 0;overflow:hidden}.tl i{display:block;height:100%;background:var(--gold);width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:12px auto 0}
.dpad button{height:88px;font-size:36px;border-radius:10px;line-height:1}.dpad small{display:block;font:700 12px 'Chakra Petch';margin-top:4px}
.dW{grid-column:2;grid-row:1}.dA{grid-column:1;grid-row:2}.dS{grid-column:2;grid-row:2}.dD{grid-column:3;grid-row:2}
.fog .dpad button{filter:blur(7px)}
.trolls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tr{padding:10px 4px;font-size:12px}.tr small{display:block;font:500 11px 'Chakra Petch'}
.trolls .tr:last-child{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.hint{color:var(--mut);font-weight:700;margin:6px 0}
.champ{text-align:center;padding:24px 10px}.champ .big{font-size:30px;color:var(--gold);word-break:break-word}
.emo{display:flex;gap:6px;justify-content:center;margin-top:14px}
.chat{max-height:140px;overflow:auto;margin-bottom:10px;font-size:14px;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:#1a1200;padding:10px 16px;border-radius:6px;font-weight:700;z-index:9;max-width:92vw;text-align:center}
#splat{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
#splat b{position:absolute;font-size:150px;line-height:1;filter:drop-shadow(0 0 6px #7a0d05)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:84px;z-index:8;pointer-events:none;color:var(--gold);text-shadow:4px 4px 0 var(--red);background:#10173add;text-align:center}.ov small{font:700 20px 'Chakra Petch';color:var(--paper);text-shadow:none}
.shake{animation:shk .12s 9}@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.fe{position:fixed;bottom:90px;font-size:40px;z-index:7;pointer-events:none;animation:fl 2s ease-out forwards}@keyframes fl{to{transform:translateY(-60vh) rotate(20deg);opacity:0}}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:7;pointer-events:none;animation:cfa 3s linear forwards}@keyframes cfa{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.shake,.fe{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="splat"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PFX='shadowroyale-gh-',MAX=10,BET=25;
const TITLES=['Grandmaster of Shadows','Carpal Tunnel King','Mind Reader','Gaze Gladiator','The Unreadable','Eye of the Storm'];
const BOTS=['Botty McMash','Clickatron','NPC Nick','Turbo Tim','Gizmo','Sir Looks-a-Lot','Shadow 9000','Dave'];
const EMOS=['🔥','👏','😂','💀','😱','🙌'];
const DIRS=['W','A','S','D'],ARW={W:'⬆️',A:'⬅️',S:'⬇️',D:'➡️'},FLIP={W:'S',S:'W',A:'D',D:'A'};
const CALM={n:'Opening Bell',d:6,d2:'Read your foe. Pick fast.'};
const EVENTS=[{n:'Fog Machine',d:6,d2:'The arrow labels are hidden. Trust the keys',fog:1},{n:'Speed Round',d:3,d2:'Only 3 seconds to pick'},{n:'Slow Burn',d:9,d2:'9 seconds. Outthink them'},
{n:'Sponsor Drop',d:6,d2:'Eliminated fans get 30 coins. Trolls cost half',half:1,fx:'spons'},{n:'Troll Frenzy',d:6,d2:'Every troll is free this round',free:1},{n:'Sudden Death',d:5,d2:'One hit wins the bout',tg1:1}];
const TROLLS={tomato:{c:10,i:'🍅',n:'Tomato'},mirror:{c:25,i:'🔄',n:'Mirror'},fog:{c:15,i:'🌫️',n:'Fog'},rush:{c:20,i:'⏱️',n:'Panic'},horn:{c:10,i:'📯',n:'Air horn'},whisper:{c:15,i:'🗣️',n:'Fake tip'}};
const $=s=>document.querySelector(s);
let peer,isHost=false,hc=null,conns={},S=null,me={id:null,name:''},loc={pick:null,tt:null},err='',busy=false,lastPh='',phAt=0,timers=[];
let code=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,4);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.players.find(p=>p.id===id)||{name:'?',coins:0};
const dn=id=>{const p=P(id);return(p.title?'['+esc(p.title)+'] ':'')+esc(p.name)};
const shuffle=a=>{a=[...a];let i=a.length;while(i>1){const j=Math.floor(Math.random()*i--);[a[i],a[j]]=[a[j],a[i]]}return a};
const inMatch=id=>S.matches.some(m=>!m.w&&(m.a===id||m.b===id));
const at=(f,ms)=>timers.push(setTimeout(f,ms));
const rd=()=>DIRS[Math.floor(Math.random()*4)];
const nmVal=()=>(($('#nm')&&$('#nm').value.trim())||'Player'+Math.floor(Math.random()*99)).slice(0,14);

/* ---------- HOST (authoritative) ---------- */
let picks={},mir={},pT=0;
const tcost=k=>S.mod.free?0:S.mod.half?Math.ceil(TROLLS[k].c/2):TROLLS[k].c;
function hostBtn(){me.name=nmVal();hostGame()}
function hostGame(){
  code=Math.random().toString(36).slice(2,6).toUpperCase();busy=true;err='';render();
  peer=new Peer(PFX+code);
  peer.on('open',id=>{isHost=true;busy=false;me.id=id;
    S={phase:'lobby',round:0,players:[{id,name:me.name,coins:100,wins:0,title:''}],matches:[],byes:[],alive:[],bets:{},champ:null,pk:{},mod:CALM};bc()});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostGame()}else{busy=false;err='Connection problem: '+e.type;render()}});
  peer.on('connection',c=>{c.on('data',m=>hmsg(c,m));c.on('close',()=>drop(c.peer))});
}
function bc(){for(const k in conns)if(conns[k].open)conns[k].send({t:'st',s:S});render()}
function hmsg(c,m){const id=c.peer;
  if(m.t==='hello'){
    if(S.players.length>=MAX||S.phase!=='lobby'){c.send({t:'full'});setTimeout(()=>c.close(),400);return}
    conns[id]=c;S.players.push({id,name:String(m.name||'Player').slice(0,14),coins:100,wins:0,title:''});bc();
  }else if(!conns[id])return;
  else if(m.t==='pick')pick(id,m.k);
  else if(m.t==='bet')bet(id,m.target);
  else if(m.t==='troll')troll(id,m.k,m.target,m.d);
  else if(m.t==='emo')emo(id,m.e);
  else if(m.t==='chat')chat(id,m.x);
}
function drop(id){delete conns[id];if(!S)return;if(S.phase==='lobby')S.players=S.players.filter(p=>p.id!==id);else P(id).gone=true;bc()}
function send(m){for(const k in conns)conns[k].open&&conns[k].send(m)}
function emo(id,e){if(!EMOS.includes(e))return;const m={t:'emo',e,from:id};send(m);floatEmo(m)}
function chat(id,x){x=String(x||'').slice(0,80).trim();if(!x)return;S.chat=((S.chat||[]).concat({id,x})).slice(-30);bc()}
function addBot(){if(S.players.length>=MAX)return;const n=S.players.filter(p=>p.bot).length;
  S.players.push({id:'bot'+Date.now(),name:BOTS[n%BOTS.length],coins:100,wins:0,title:'',bot:1});bc()}
function bet(id,t){if(S.phase!=='bracket'||inMatch(id)||!S.alive.includes(t))return;const p=P(id),old=S.bets[id];
  if(old){p.coins+=BET;delete S.bets[id];if(old===t){bc();return}}
  if(p.coins>=BET){p.coins-=BET;S.bets[id]=t}bc()}
function startT(){S.players=S.players.filter(p=>!p.gone);if(S.players.length<2)return;
  S.players.forEach(p=>p.coins=Math.max(p.coins,100));S.alive=S.players.map(p=>p.id);S.bets={};S.round=0;S.champ=null;S.matches=[];S.byes=[];nextRound()}
function nextRound(){
  S.round++;const a=shuffle(S.alive);S.matches=[];S.byes=[];
  for(let i=0;i<a.length;i+=2)a[i+1]?S.matches.push({a:a[i],b:a[i+1],att:Math.random()<.5?a[i]:a[i+1],st:0,x:0,tg:3,w:null,h:[]}):S.byes.push(a[i]);
  S.alive=a;S.mod=S.round===1?CALM:EVENTS[Math.floor(Math.random()*EVENTS.length)];
  S.rname=a.length===2?'GRAND FINAL':a.length<=4?'SEMIFINALS':'ROUND '+S.round;
  if(S.mod.fx==='spons')S.players.forEach(q=>{if(!a.includes(q.id))q.coins+=30});
  S.phase='bracket';bc();at(startTurn,a.length===2?9000:6500)}
function startTurn(){picks={};mir={};S.pk={};
  S.matches.forEach(m=>{if(m.w)return;m.x++;m.tg=S.mod.tg1?1:m.x>10?1:m.x>5?2:3;m.pt=m.lk=m.ta=null;m.res=null;m.mf={};
    [m.a,m.b].forEach(id=>{const q=P(id);if(q.gone)at(()=>pick(id,rd()),50);else if(q.bot)at(()=>pick(id,rd()),700+Math.random()*2200)})});
  S.phase='pick';bc();pT=setTimeout(goReveal,S.mod.d*1000)}
function pick(id,k){if(S.phase!=='pick'||!DIRS.includes(k)||picks[id]||!inMatch(id))return;picks[id]=k;S.pk[id]=1;bc();
  if(S.matches.every(m=>m.w||(picks[m.a]&&picks[m.b])))goReveal()}
function troll(id,k,t,d){const T=TROLLS[k];if(S.phase!=='pick'||!T||inMatch(id)||!inMatch(t)||picks[t])return;
  const p=P(id),c=tcost(k);if(p.coins<c)return;p.coins-=c;
  if(k==='mirror')mir[t]=id;
  else{const m={t:'fx',k,target:t,from:id,d:DIRS.includes(d)?d:rd()};send(m);fx(m);if(k==='rush')at(()=>pick(t,rd()),2000)}
  bc()}
function goReveal(){clearTimeout(pT);if(S.phase!=='pick')return;
  S.matches.forEach(m=>{if(m.w)return;const A=m.att,D=A===m.a?m.b:m.a;
    let pt=picks[A]||rd(),lk=picks[D]||rd();if(mir[A])pt=FLIP[pt];if(mir[D])lk=FLIP[lk];
    m.mf={};[A,D].forEach(id=>{if(mir[id])m.mf[id]=mir[id]});m.ta=A;m.pt=pt;m.lk=lk;
    if(pt===lk){m.st++;m.res='hit';if(m.st>=m.tg){m.w=A;m.res='win';P(A).coins+=20}}
    else{m.res='miss';m.att=D;m.st=0}
    m.h=m.h.concat({pt,lk,r:m.res}).slice(-5)});
  S.phase='reveal';bc();
  at(()=>{if(S.matches.every(m=>m.w)){S.alive=[...S.byes,...S.matches.map(m=>m.w)];S.alive.length===1?finish():nextRound()}else startTurn()},3000)}
function finish(){const id=S.alive[0],p=P(id);p.wins++;p.title=TITLES[Math.floor(Math.random()*TITLES.length)];S.champ=id;S.won=[];
  for(const b in S.bets)if(S.bets[b]===id){P(b).coins+=BET*3;S.won.push(b)}
  S.phase='end';bc()}
function backToLobby(){S.phase='lobby';S.matches=[];S.byes=[];S.bets={};S.champ=null;S.players=S.players.filter(p=>!p.gone);bc()}

/* ---------- GUEST ---------- */
function joinBtn(){me.name=nmVal();code=($('#rc').value||'').trim().toUpperCase();if(code.length<4){err='Enter the 4-letter room code';render();return}
  err='';busy=true;render();peer=new Peer();
  peer.on('open',id=>{me.id=id;hc=peer.connect(PFX+code,{reliable:true});
    hc.on('open',()=>hc.send({t:'hello',name:me.name}));
    hc.on('data',m=>{if(m.t==='st'){busy=false;S=m.s;render()}else if(m.t==='fx')fx(m);else if(m.t==='emo')floatEmo(m);
      else if(m.t==='full'){busy=false;err='That room is full or already started';S=null;render()}});
    hc.on('close',()=>{busy=false;err='Disconnected from the host';S=null;render()});
    setTimeout(()=>{if(!S&&busy){busy=false;err='Could not reach that room. Check the code and try again.';render()}},9000)});
  peer.on('error',e=>{busy=false;err=e.type==='peer-unavailable'?'No room with that code':'Connection problem: '+e.type;render()});
}
const tell=m=>isHost?null:hc&&hc.open&&hc.send(m);
function act(k,t){if(isHost)bet(me.id,t);else tell({t:'bet',target:t})}
function doPick(k){if(!S||S.phase!=='pick'||loc.pick||!inMatch(me.id))return;loc.pick=k;isHost?pick(me.id,k):tell({t:'pick',k});render()}
function setTT(id){loc.tt=id;render()}
function doTroll(k,d){const t=loc.tt;if(!t)return;isHost?troll(me.id,k,t,d):tell({t:'troll',k,target:t,d});
  if(k==='mirror')toast('Mirror armed. It stays secret until the reveal');render()}
function sendEmo(e){isHost?emo(me.id,e):tell({t:'emo',e})}
function sendChat(){const i=$('#ci'),x=i.value.trim();if(!x)return;i.value='';isHost?chat(me.id,x):tell({t:'chat',x})}
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT')return;
  const k={w:'W',a:'A',s:'S',d:'D',arrowup:'W',arrowleft:'A',arrowdown:'S',arrowright:'D'}[e.key.toLowerCase()];if(k){doPick(k);e.preventDefault()}});

/* ---------- EFFECTS ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function ov(h,ms){const d=document.createElement('div');d.className='ov';d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function shake(){const a=$('#app');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),1200)}
function tone(f,ms,type){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},ms)}catch(e){}}
function fx(m){if(!S)return;const T=TROLLS[m.k];toast(`${T.i} ${dn(m.from)} sent ${T.n} to ${dn(m.target)}`);if(m.target!==me.id)return;
  if(m.k==='tomato'){const w=$('#splat');for(let i=0;i<5;i++){const b=document.createElement('b');b.textContent='🍅';b.style.left=Math.random()*70+'%';b.style.top=Math.random()*75+'%';w.appendChild(b)}setTimeout(()=>w.innerHTML='',2500)}
  if(m.k==='fog'){const p=$('#pad');if(p){p.classList.add('fog');setTimeout(()=>p.classList.remove('fog'),6000)}}
  if(m.k==='horn'){tone(150,900,'sawtooth');shake()}
  if(m.k==='rush'){tone(900,200);shake();ov('⏱️ PICK NOW!',1800)}
  if(m.k==='whisper')ov('<small>A fan whispers... (could be a lie)</small>'+ARW[m.d],2400)}
function floatEmo(m){const d=document.createElement('span');d.className='fe';d.textContent=m.e;d.style.left=(8+Math.random()*80)+'%';document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}
function confetti(){const c=['#e8392f','#2f7bff','#f5c542','#f6efe0'];for(let i=0;i<60;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
function copyLink(){const l=location.origin+location.pathname+'?room='+code;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Invite link copied'),()=>prompt('Copy this invite link',l))}

/* ---------- VIEWS ---------- */
const hue=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return h};
function fighter(id,look,pt,big){const h=hue(id),o={W:[0,-2.2],S:[0,2.2],A:[-2.4,0],D:[2.4,0]}[look]||[0,0],g={W:[40,6],A:[4,26],S:[40,50],D:[52,26]}[pt]||[38,38];
  return `<svg class="f ${big?'big':''}" viewBox="-4 0 64 56"><rect x="14" y="27" width="20" height="19" rx="5" fill="hsl(${h} 70% 50%)"/><rect x="15" y="44" width="7" height="10" fill="#1a1a2e"/><rect x="26" y="44" width="7" height="10" fill="#1a1a2e"/><line x1="32" y1="31" x2="${g[0]}" y2="${g[1]}" stroke="hsl(${h} 70% 40%)" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="15" r="13" fill="#f2c9a0" stroke="#0a1030" stroke-width="2"/><circle cx="19" cy="14" r="4.2" fill="#fff"/><circle cx="29" cy="14" r="4.2" fill="#fff"/><circle cx="${19+o[0]}" cy="${14+o[1]}" r="2" fill="#10173a"/><circle cx="${29+o[0]}" cy="${14+o[1]}" r="2" fill="#10173a"/><path d="M18 22 q6 4 12 0" stroke="#10173a" stroke-width="2" fill="none"/><circle cx="${g[0]}" cy="${g[1]}" r="7" fill="#e8392f" stroke="#0a1030" stroke-width="2"/></svg>`}
const EMOBAR='<div class="emo">'+EMOS.map(e=>`<button class="ghost sm" onclick="sendEmo('${e}')">${e}</button>`).join('')+'</div>';
const chatHTML=()=>`<div class="card"><h2>Lounge</h2><div class="chat">${(S.chat||[]).map(c=>`<div><b>${dn(c.id)}:</b> ${esc(c.x)}</div>`).join('')||'Say something to the room.'}</div><div class="row"><input id="ci" maxlength="80" placeholder="Trash talk..." onkeydown="if(event.key==='Enter')sendChat()" style="margin:0"><button class="ghost" style="flex:none" onclick="sendChat()">Send</button></div></div>`;
function homeHTML(){return `<h1>SHADOW<br>ROYALE</h1><p>Shadow boxing, knockout style. Point where your foe will look, or look where they won't point. Chain three hits to win. Up to 10 players.</p>
<div class="card"><input id="nm" placeholder="Your name" maxlength="14" value="${esc(me.name)}" autocomplete="off">
<button class="red" style="width:100%" onclick="hostBtn()" ${busy?'disabled':''}>Host a tournament</button>
<div class="or">or join a friend's room</div>
<input id="rc" placeholder="Room code" maxlength="4" value="${esc(code)}" autocomplete="off" style="text-transform:uppercase">
<button style="width:100%" onclick="joinBtn()" ${busy?'disabled':''}>${busy?'Connecting...':'Join room'}</button>
${err?`<div class="err">${esc(err)}</div>`:''}</div>`}
function lobbyHTML(){const n=S.players.length;
  return `<h2>Lobby</h2><div class="card"><p style="margin:0;text-align:center">Room code</p><div class="code big">${esc(code)}</div><div class="row"><button class="ghost" onclick="copyLink()">Copy invite link</button></div></div>
<div class="card"><h2>Fighters ${n}/${MAX}</h2>${S.players.map(p=>`<div class="pl"><span>${dn(p.id)}${p.id===me.id?' (you)':''}</span><small>${p.wins} win${p.wins===1?'':'s'} &middot; ${p.coins} coins</small></div>`).join('')}</div>
${isHost?`<div class="row"><button class="ghost" onclick="addBot()" ${n>=MAX?'disabled':''}>Add a bot</button><button class="gold" onclick="startT()" ${n<2?'disabled':''}>Start tournament</button></div>${n<2?'<p style="margin-top:10px">Share the code or add a bot to start.</p>':''}`:'<p>Waiting for the host to start the tournament...</p>'}
<div class="card" style="margin-top:14px"><h2>How a bout works</h2><p style="margin:0 0 8px">One fighter attacks, the other defends. Both secretly pick W, A, S or D (or the arrow keys).</p><p style="margin:0 0 8px"><b>Match = the attacker scores.</b> Land 3 hits in a row to win. <b>Miss = roles swap</b> and the streak resets. Long bouts get easier: the target drops to 2 after 5 turns and to 1 after 10.</p><p style="margin:0">Knocked out? Spend coins to troll live fighters: Mirror flips their controls in secret, Fog blurs their pad, Panic gives them 2 seconds, Air horn blasts and shakes their screen, Fake tip whispers a direction (maybe a lie), and Tomato splats them.</p></div>${chatHTML()}`}
function topHTML(){return `<div class="stage"><small>${S.mod.n}: ${S.mod.d2}</small><div class="big">${S.rname}</div></div><div class="top"><span>Round ${S.round}</span><span>${S.alive.length} left</span><span>${P(me.id).coins} coins</span></div>`}
function boardHTML(){
  const ph=S.phase,pk=ph==='pick',br=ph==='bracket',rv=ph==='reveal',spec=!inMatch(me.id);
  const btn=id=>spec&&br&&S.alive.includes(id)?`<button class="sm ${S.bets[me.id]===id?'on':''}" onclick="act('bet','${id}')">${S.bets[me.id]===id?'Bet placed':'Bet '+BET}</button>`
    :spec&&pk&&!(S.pk&&S.pk[id])&&inMatch(id)?`<button class="sm ${loc.tt===id?'on':''}" onclick="setTT('${id}')">Troll</button>`:'';
  const side=(m,id)=>{const att=(rv?m.ta:m.att)===id,dir=rv?(att?m.pt:m.lk):null;
    return `<div class="side ${m.w===id?'win':''} ${m.w&&m.w!==id?'lose':''} ${id===me.id?'me':''}">${fighter(id,dir,rv&&att?m.pt:null)}<div class="nm">${dn(id)}${P(id).gone?' (left)':''}${pk&&S.pk&&S.pk[id]?' ✓':''}${rv&&m.mf&&m.mf[id]?' 🔄':''}<br><small>${m.w?'':att?'🎯 Attacker':'👀 Defender'}</small></div><div class="pts">${dir?ARW[dir]:''}${btn(id)}</div></div>`};
  let h=S.matches.map(m=>`<div class="m ${m.a===me.id||m.b===me.id?'mine':''}">${side(m,m.a)}${side(m,m.b)}<div class="mid">Streak ${m.st}/${m.tg}${rv?(m.res==='win'?' &middot; KNOCKOUT!':m.res==='hit'?' &middot; HIT!':' &middot; Miss. Roles swap'):''}</div>${m.h.length?`<div class="hist"><small>pointed/looked:</small>${m.h.map(e=>`<span class="${e.r==='miss'?'x':'o'}">${ARW[e.pt]}${ARW[e.lk]}</span>`).join('')}</div>`:''}</div>`).join('');
  h+=S.byes.map(id=>`<div class="bye"><span>${dn(id)} <small>(bye, advances)</small></span>${btn(id)}</div>`).join('');
  return h}
function myM(){return S.matches.find(m=>!m.w&&(m.a===me.id||m.b===me.id))}
function padHTML(mine){const ph=S.phase;
  if(ph==='bracket')return `<div class="card"><h2>${S.mod.n}</h2><p style="margin:0">${S.mod.d2}</p></div>`+(mine?'':`<div class="hint">You're spectating. Bet ${BET} coins on who wins it all. A win pays ${BET*3}.</div>`);
  if(ph==='pick'){
    if(mine){const att=myM().att===me.id,lab=k=>S.mod.fog?'?':ARW[k];
      return `<div class="role ${att?'att':'def'}">${att?'🎯 You attack: point where they will look':'👀 You defend: look where they will not point'}</div><div class="tl"><i id="tl"></i></div>${loc.pick?'<div class="hint">Locked in. Waiting for your opponent...</div>':''}<div class="dpad">${DIRS.map(k=>`<button class="d${k} ${loc.pick===k?'gold':''}" ${loc.pick?'disabled':''} onclick="doPick('${k}')">${lab(k)}<small>${k}</small></button>`).join('')}</div>`}
    const tt=loc.tt&&inMatch(loc.tt)&&!(S.pk&&S.pk[loc.tt])?loc.tt:null,co=P(me.id).coins;
    const ok=k=>tt&&co>=tcost(k)?'':'disabled';
    return `<div class="hint">${tt?'Target: '+dn(tt):'Tap Troll on a fighter to choose a target.'} &middot; ${co} coins</div><div class="tl"><i id="tl"></i></div><div class="trolls">${Object.keys(TROLLS).map(k=>{const T=TROLLS[k];
      return k==='whisper'?`<div class="tr">${T.i} ${T.n} ${tcost(k)} ${DIRS.map(d=>`<button class="sm ghost" ${ok(k)} onclick="doTroll('whisper','${d}')">${ARW[d]}</button>`).join('')}</div>`
        :`<button class="tr ghost" ${ok(k)} onclick="doTroll('${k}')">${T.i} ${T.n}<small>${tcost(k)} coins</small></button>`}).join('')}</div>`}
  if(ph==='reveal')return '<div class="hint">Reading the gaze...</div>';
  return ''}
function endHTML(){const w=S.champ,rank=[...S.players].sort((a,b)=>b.wins-a.wins);
  return `<div class="card champ">${fighter(w,'S','W',1)}<div class="big" style="font-size:44px">\u{1F3C6}</div><p style="margin:0">Champion</p><div class="big">${dn(w)}</div>${S.won&&S.won.length?`<p style="margin-top:12px">Correct bets: ${S.won.map(dn).join(', ')} (+${BET*3} each)</p>`:''}</div>
<div class="card"><h2>Wins</h2>${rank.map(p=>`<div class="pl"><span>${dn(p.id)}</span><small>${p.wins} &middot; ${p.coins} coins</small></div>`).join('')}</div>
${chatHTML()}${EMOBAR}
${isHost?'<button class="gold" style="width:100%" onclick="backToLobby()">Back to lobby</button>':'<p>Waiting for the host to reopen the lobby...</p>'}`}
function onPhase(){
  if(S.phase==='pick'){loc.pick=null;if(loc.tt&&!inMatch(loc.tt))loc.tt=null}
  if(S.phase==='end')confetti();
  if(S.phase==='reveal')S.matches.forEach(m=>{if(m.mf)for(const id in m.mf)toast('🔄 '+dn(id)+' was mirrored by '+dn(m.mf[id]));
    if(m.a===me.id||m.b===me.id)tone(m.res==='miss'?200:m.res==='win'?900:600,200)})}
function render(){
  const app=$('#app');
  if(!S){app.innerHTML=homeHTML();return}
  if(S.phase!==lastPh){lastPh=S.phase;phAt=performance.now();onPhase()}
  if(S.phase==='lobby'||S.phase==='end'){const c=$('#ci'),v=c?c.value:'',f=c&&document.activeElement===c;
    app.innerHTML=S.phase==='end'?endHTML():lobbyHTML();const n=$('#ci');if(n){n.value=v;if(f)n.focus()}return}
  if(!$('#board'))app.innerHTML='<div id="top"></div><div id="board"></div><div id="pad"></div>'+EMOBAR;
  $('#top').innerHTML=topHTML();$('#board').innerHTML=boardHTML();$('#pad').innerHTML=padHTML(inMatch(me.id));
}
setInterval(()=>{if(!S||S.phase!=='pick')return;const tl=$('#tl');if(tl)tl.style.width=Math.max(0,100-(performance.now()-phAt)/(S.mod.d*10))+'%'},80);
render();
</script>
</body>
</html>
