<title>Shadow Royale: Chase</title>

<style>

.fw{position:fixed;width:9px;height:9px;border-radius:50%;z-index:7;pointer-events:none;box-shadow:0 0 8px currentColor;animation:fwa 1.2s ease-out forwards}@keyframes fwa{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.m.fin .ring{filter:saturate(.7) brightness(.92)}.m.fin .mid{background:#0e2a1e;color:#9bf0c0}

.lab{font-weight:700;color:var(--mut);margin:12px 0 4px}.cr{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700}.cr span{flex:1}
.ed input{width:auto;margin:0;padding:0;border:0;background:none;font:inherit}

.tgt.s{border-color:#38c7d9}.tgt.b{border-color:var(--red)}@keyframes tgx{0%,60%{opacity:1}100%{opacity:.2}}

<body>
<div id="bg"></div><div id="app"></div>
<div id="splat"></div>
<script>
const PFX='shadowroyale-gh-',MAX=10;
/* ---------- relay transport: the few PeerJS calls the game uses, but all traffic goes through the server over WebSocket (works on school wifi) ---------- */
const PCFG={};
class RConn{constructor(P,id){this.P=P;this.peer=id;this.open=false;this.h={}}
 on(e,f){this.h[e]=f}
 _e(e,a){this.h[e]&&this.h[e](a)}
 _open(){this.open=true;this._e('open')}
 send(m){if(this.open)this.P._tx(this.P.host?{k:'d',to:this.peer,m}:{k:'d',m})}
 close(){if(!this.open)return;this.open=false;this.P._tx(this.P.host?{k:'kick',to:this.peer}:{k:'leave'});this._e('close')}}
class Peer{
 constructor(id){this.h={};this.conns={};this.out=null;this.host=!!id;this.id=id||('g'+Math.random().toString(36).slice(2,10));this.destroyed=false;this.disconnected=false;this.opened=false;this._go()}
 on(e,f){this.h[e]=f}
 _e(e,a){this.h[e]&&this.h[e](a)}
 _tx(o){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o))}
 _go(){const u=(window.RELAY_URL||((location.protocol==='https:'?'wss://':'ws://')+location.host))+'/ws';let ws;
  try{ws=this.ws=new WebSocket(u)}catch(_){setTimeout(()=>this._e('error',{type:'network'}),0);return}
  ws.onopen=()=>{this.disconnected=false;dbg('relay: connected');this._tx(this.host?{k:'reg',id:this.id}:{k:'hi',id:this.id})};
  ws.onmessage=ev=>{if(ws!==this.ws)return;let m;try{m=JSON.parse(ev.data)}catch(_){return}this._rx(m)};
  ws.onerror=()=>{};
  ws.onclose=()=>{if(ws!==this.ws||this.destroyed)return;dbg('relay: connection closed');this.disconnected=true;
   for(const k in this.conns){const c=this.conns[k];if(c.open){c.open=false;c._e('close')}}this.conns={};
   if(this.out&&this.out.open){this.out.open=false;this.out._e('close')}
   if(!this.opened)this._e('error',{type:'network'});else this._e('disconnected')}}
 _rx(m){const k=m.k;
  if(k==='ok'){if(!this.opened){this.opened=true;this._e('open',this.id)}}
  else if(k==='taken'){if(this.opened)setTimeout(()=>this.reconnect(),3000);else this._e('error',{type:'unavailable-id'})}
  else if(k==='peer'){const c=new RConn(this,m.id);this.conns[m.id]=c;this._e('connection',c);c._open()}
  else if(k==='d'){const c=this.host?this.conns[m.from]:this.out;if(c)c._e('data',m.m)}
  else if(k==='bye'){const c=this.conns[m.id];if(c&&c.open){c.open=false;c._e('close')}delete this.conns[m.id]}
  else if(k==='joined'){if(this.out)this.out._open()}
  else if(k==='nohost')this._e('error',{type:'peer-unavailable'})
  else if(k==='closed'){if(this.out&&this.out.open){this.out.open=false;this.out._e('close')}}}
 connect(id){const c=this.out=new RConn(this,id);this._tx({k:'join',room:id});return c}
 reconnect(){if(this.destroyed)return;try{this.ws&&this.ws.close()}catch(_){}this._go()}
 destroy(){this.destroyed=true;this.disconnected=true;try{this.ws&&this.ws.close()}catch(_){}}}
const TITLES=['Grandmaster of Shadows','Carpal Tunnel King','Mind Reader','Gaze Gladiator','The Unreadable','Eye of the Storm'];
const BOTS=['Botty McMash','Clickatron','NPC Nick','Turbo Tim','Gizmo','Sir Looks-a-Lot','Shadow 9000','Dave'];
const EMOS=['🔥','👏','😂','💀','😱','🙌'];
const DIRS=['W','A','S','D'],ARW={W:'⬆️',A:'⬅️',S:'⬇️',D:'➡️'},FLIP={W:'S',S:'W',A:'D',D:'A'};
const TROLLS={tomato:{c:10,i:'🍅',n:'Tomato'},mirror:{c:25,i:'🔄',n:'Mirror'},fog:{c:15,i:'🌫️',n:'Fog'},rush:{c:20,i:'⏱️',n:'Panic'},horn:{c:10,i:'📯',n:'Air horn'},whisper:{c:15,i:'🗣️',n:'Fake tip'}};
const $=s=>document.querySelector(s);
const DBG=[],dbg=m=>{DBG.push(Math.round(performance.now()/1000)+'s '+m);if(DBG.length>14)DBG.shift()};
let peer,isHost=false,hc=null,conns={},S=null,me={id:null,name:''},loc={pick:null,tt:null},err='',busy=false,lastPh='',dph={},timers=[];
let code=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,4);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.players.find(p=>p.id===id)||{name:'?',coins:0};
const dn=id=>{const p=P(id);return(p.title?'['+esc(p.title)+'] ':'')+esc(p.name)};
const inMatch=id=>S.duels.some(m=>m.a===id||m.b===id);
const mOf=id=>S.duels.find(m=>m.a===id||m.b===id);
const nd=(m,id)=>Math.max(1,(id===m.a?2:3)-((m.red&&m.red[id])||0));
const rdFor=(d)=>{const ok=DIRS.filter(k=>!d.rm.includes(k));return ok[Math.floor(Math.random()*ok.length)]};
const at=(f,ms)=>timers.push(setTimeout(f,ms));
const rd=()=>DIRS[Math.floor(Math.random()*4)];
const nmVal=()=>(($('#nm')&&$('#nm').value.trim())||'Player'+Math.floor(Math.random()*99)).slice(0,14);

/* ---------- HOST (authoritative) ---------- */
function hostBtn(){me.name=nmVal();hostGame()}
function hostGame(){
  code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');busy=true;err='';render();
  peer=new Peer(PFX+code,PCFG);const pp=peer;
  /* if the host's link to the signalling server drops (tab idle, wifi blip) the room code stops resolving - reconnect until it's back */
  pp.on('disconnected',()=>{const rc=()=>{if(pp.destroyed||!pp.disconnected)return;try{pp.reconnect()}catch(_){}setTimeout(rc,3000)};setTimeout(rc,500)});
  peer.on('open',id=>{isHost=true;busy=false;me.id=id;
    S={phase:'lobby',players:[{id,name:me.name,coins:100,wins:0,title:'',look:me.look}],duels:[],alive:[],champ:null};bc()});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostGame()}else{busy=false;err='Connection problem: '+e.type;render()}});
  peer.on('connection',c=>{c.on('data',m=>hmsg(c,m));c.on('close',()=>drop(c.peer))});
}
function bc(){for(const k in conns)if(conns[k].open)conns[k].send({t:'st',s:S});render()}
function hmsg(c,m){const id=c.peer;
  if(m.t==='hello'){
    if(S.players.length>=MAX||S.phase!=='lobby'){c.send({t:'full',w:S.players.length>=MAX?'full':'started'});setTimeout(()=>c.close(),400);return}
    conns[id]=c;S.players.push({id,name:String(m.name||'Player').slice(0,14),coins:100,wins:0,title:'',look:cleanLook(m.look,id)});bc();
  }else if(!conns[id])return;
  else if(m.t==='p'){if(S.phase==='play'&&S.alive.includes(id)&&!inMatch(id)&&Array.isArray(m.a)&&m.a.length>=7&&m.a.slice(0,4).every(Number.isFinite))snap(id,m.a)}
  else if(m.t==='th'){if(S.phase==='play'&&S.alive.includes(id)&&!inMatch(id)){const q={t:'th',id,x0:+m.x0,y0:+m.y0,x1:+m.x1,y1:+m.y1,dur:Math.min(1200,+m.dur||600)};if([q.x0,q.y0,q.x1,q.y1].every(isFinite)){send(q);addProj(q)}}}
  else if(m.t==='hit')caught(id,m.by);
  else if(m.t==='spam'){const d=mOf(id);if(d)spamSet(d,id,m.n)}
  else if(m.t==='pick'){const d=mOf(id);if(d)dpick(d,id,m.k)}
  else if(m.t==='troll')troll(id,m.k,m.target,m.d);
  else if(m.t==='emo')emo(id,m.e);
  else if(m.t==='chat')chat(id,m.x);
  else if(m.t==='look')setLook(id,m.look);
}
function drop(id){delete conns[id];delete R[id];if(!S)return;
  if(S.phase==='lobby')S.players=S.players.filter(p=>p.id!==id);
  else{const p=P(id);p.gone=true;if(S.phase==='play'&&S.alive.includes(id)&&!inMatch(id)){p.out=1;S.alive=S.alive.filter(i=>i!==id);if(S.alive.length===1){finish();return}}}
  bc()}
/* ---- chase + shadow battle (host is the referee for bouts; every player moves their own character) ---- */
function startT(){S.players=S.players.filter(p=>!p.gone);if(S.players.length<2)return;timers.forEach(clearTimeout);timers=[];
  S.players.forEach(p=>{p.coins=Math.max(p.coins,100);p.out=0});S.alive=S.players.map(p=>p.id);S.duels=[];S.champ=null;
  for(const k in BO)delete BO[k];for(const k in IM)delete IM[k];hGo=performance.now()+3000;S.phase='play';bc();
  S.alive.forEach((id,i)=>{const a=i/S.alive.length*6.283,[x,y]=res(WW/2+Math.cos(a)*620,WH/2+Math.sin(a)*380,RR);spawn(id,x,y,4000)})}
function spawn(id,x,y,ms){IM[id]=performance.now()+ms;if(P(id).bot)BO[id]={x,y,vx:0,vy:0,s:0,l:0,loud:0,tx:x,ty:y,wt:1,cd:3};const m={t:'sp',id,x,y,ms};send(m);onSp(m)}
function lastPos(id){const now=performance.now();if(id===me.id)return{x:ME.x,y:ME.y,vx:ME.vx,vy:ME.vy,s:ME.s,l:now<ME.loud};
  const B=BO[id];if(B)return{x:B.x,y:B.y,vx:B.vx,vy:B.vy,s:B.s,l:now<B.loud};
  const r=R[id];if(!r||!r.b.length)return null;const l=r.b[r.b.length-1];return{x:l.x,y:l.y,vx:r.vx,vy:r.vy,s:r.s,l:r.l}}
function caught(v,by){if(!S||S.phase!=='play'||v===by||!S.alive.includes(v)||!S.alive.includes(by)||inMatch(v)||inMatch(by)||performance.now()<(IM[v]||0))return;
  const p=lastPos(v)||{x:WW/2,y:WH/2},d={id:++did,a:by,b:v,att:by,st:0,x:0,tg:2,w:null,h:[],sw:0,rm:[],red:{},n:0,lm:0,ph:'intro',pk:{},mf:{},px:p.x,py:p.y};
  HP[d.id]={pk:{},mir:{}};S.duels.push(d);const m={t:'ct',a:by,b:v};send(m);gmsg(m);bc();at(()=>startTurn(d),2800)}
function startTurn(d){if(!S.duels.includes(d))return;d.n++;if(d.lm){d.x++;d.lm=0;if(d.x===30||d.x===40)return spamOff(d)}d.tg=nd(d,d.att);d.pt=d.lk=d.res=d.nk=null;d.mf={};d.pk={};HP[d.id]={pk:{},mir:{}};d.ph='pick';d.dd=5;const x0=d.n;
  [d.a,d.b].forEach(id=>{const q=P(id),f=()=>{if(S.duels.includes(d)&&d.n===x0&&d.ph==='pick')dpick(d,id,rdFor(d))};if(q.gone)at(f,50);else if(q.bot)at(f,700+Math.random()*2000)});
  bc();clearTimeout(DT[d.id]);DT[d.id]=setTimeout(()=>reveal(d),d.dd*1000)}
function spamOff(d){d.ph='spam';d.dd=6;d.sc={[d.a]:0,[d.b]:0};d.spw=null;HP[d.id]={pk:{},mir:{},sp:{}};const x0=d.n;
  [d.a,d.b].forEach(id=>{if(P(id).bot){const n=30+Math.floor(Math.random()*30);at(()=>spamSet(d,id,Math.round(n/2)),3000);at(()=>spamSet(d,id,n),5700)}});
  bc();clearTimeout(DT[d.id]);at(()=>spamEnd(d,x0),6000)}
function spamSet(d,id,n){const h=HP[d.id];if(!h||!h.sp||d.ph!=='spam')return;h.sp[id]=Math.max(h.sp[id]||0,Math.min(120,n|0));d.sc[id]=h.sp[id];bc()}
function spamEnd(d,x0){if(!S.duels.includes(d)||d.ph!=='spam'||d.n!==x0)return;const h=HP[d.id],A=h.sp[d.a]||0,B=h.sp[d.b]||0,w=A===B?(Math.random()<.5?d.a:d.b):A>B?d.a:d.b;
  d.red[w]=(d.red[w]||0)+1;d.spw=w;d.ph='spamres';bc();at(()=>startTurn(d),2500)}
function dpick(d,id,k){const h=d&&HP[d.id];if(!h||d.ph!=='pick'||!DIRS.includes(k)||h.pk[id]||d.rm.includes(k))return;h.pk[id]=k;d.pk[id]=1;bc();if(h.pk[d.a]&&h.pk[d.b])reveal(d)}
function reveal(d){clearTimeout(DT[d.id]);if(d.ph!=='pick'||!S.duels.includes(d))return;const h=HP[d.id],A=d.att,D=A===d.a?d.b:d.a;
  let pt=h.pk[A]||rdFor(d),lk=h.pk[D]||rdFor(d);d.mf={};
  if(h.mir[A]&&!d.rm.includes(FLIP[pt])){pt=FLIP[pt];d.mf[A]=h.mir[A]}if(h.mir[D]&&!d.rm.includes(FLIP[lk])){lk=FLIP[lk];d.mf[D]=h.mir[D]}
  d.ta=A;d.pt=pt;d.lk=lk;
  if(pt===lk){d.st++;d.res='hit';if(d.st>=d.tg){d.w=A;d.res='win';P(A).coins+=20}}
  else{d.res='miss';d.lm=1;d.att=D;d.st=0;d.sw++;const n=d.sw>10?Math.min(2,1+Math.floor((d.sw-11)/5)):0;while(d.rm.length<n){const ok=DIRS.filter(k=>!d.rm.includes(k));d.nk=ok[Math.floor(Math.random()*ok.length)];d.rm.push(d.nk)}}
  d.h=d.h.concat({pt,lk,r:d.res}).slice(-5);d.ph='reveal';bc();at(()=>d.w?endDuel(d):startTurn(d),3000)}
function endDuel(d){if(!S.duels.includes(d))return;S.duels=S.duels.filter(x=>x!==d);const w=d.w,l=w===d.a?d.b:d.a;P(l).out=1;S.alive=S.alive.filter(i=>i!==l);delete HP[d.id];
  if(P(w).gone){P(w).out=1;S.alive=S.alive.filter(i=>i!==w)}
  if(S.alive.length===1){finish();return}if(!S.alive.length){backToLobby();return}
  spawn(w,d.px,d.py,3000);bc()}
function troll(id,k,t,dk){const T=TROLLS[k],d=mOf(t),p=P(id);if(!T||!d||d.ph!=='pick'||!p.out||HP[d.id].pk[t]||p.coins<T.c)return;p.coins-=T.c;
  if(k==='mirror')HP[d.id].mir[t]=id;
  else{const m={t:'fx',k,target:t,from:id,d:DIRS.includes(dk)?dk:rd()};send(m);fx(m);if(k==='rush'){const x0=d.n;at(()=>{if(S.duels.includes(d)&&d.n===x0&&d.ph==='pick')dpick(d,t,rdFor(d))},2000)}}
  bc()}
function finish(){const id=S.alive[0],p=P(id);p.wins++;p.title=TITLES[Math.floor(Math.random()*TITLES.length)];S.champ=id;S.duels=[];S.phase='end';bc()}
function backToLobby(){S.phase='lobby';S.duels=[];S.champ=null;S.players=S.players.filter(p=>!p.gone);S.players.forEach(p=>p.out=0);bc()}
/* ---- bots (simulated by the host) ---- */
function botTick(dt,now){for(const id of S.alive){if(!P(id).bot||inMatch(id))continue;const B=BO[id];if(!B)continue;B.cd-=dt;B.wt-=dt;
  let tg=null,td=340;for(const o of S.alive){if(o===id||inMatch(o))continue;const p=lastPos(o);if(!p)continue;const d=Math.hypot(p.x-B.x,p.y-B.y);if(d<td&&d<((p.s&&!p.l)?150:420)){td=d;tg=p}}
  if(tg&&B.cd<=0&&now>hGo){const ex=tg.x+tg.vx*.45+(Math.random()-.5)*70,ey=tg.y+tg.vy*.45+(Math.random()-.5)*70,dx=ex-B.x,dy=ey-B.y,d=Math.hypot(dx,dy)||1,l=Math.min(d,470),m={t:'th',id,x0:B.x,y0:B.y,x1:B.x+dx/d*l,y1:B.y+dy/d*l,dur:380+l*.7};B.cd=2.2+Math.random()*2.5;B.loud=now+1500;send(m);addProj(m)}
  if(tg){B.tx=tg.x;B.ty=tg.y;B.s=td>180?0:1}
  else if(B.wt<=0||Math.hypot(B.tx-B.x,B.ty-B.y)<30){const z=zone();B.tx=z.x+60+Math.random()*(z.w-120);B.ty=z.y+60+Math.random()*(z.h-120);B.wt=3+Math.random()*3;B.s=Math.random()<.5?1:0}
  const dx=B.tx-B.x,dy=B.ty-B.y,d=Math.hypot(dx,dy);
  if(d>12){const sp=(B.s?SNK:RUN)*.85;B.vx=dx/d*sp;B.vy=dy/d*sp;[B.x,B.y]=res(B.x+B.vx*dt,B.y+B.vy*dt,RR)}else{B.vx=B.vy=0}}}
function send(m){for(const k in conns)conns[k].open&&conns[k].send(m)}
function emo(id,e){if(!EMOS.includes(e))return;const m={t:'emo',e,from:id};send(m);floatEmo(m)}
function chat(id,x){x=String(x||'').slice(0,80).trim();if(!x)return;S.chat=((S.chat||[]).concat({id,x})).slice(-30);bc()}
function addBot(){if(S.players.length>=MAX)return;const n=S.players.filter(p=>p.bot).length;
  S.players.push({id:'bot'+Date.now(),name:BOTS[n%BOTS.length],coins:100,wins:0,title:'',bot:1,look:rndLook()});bc()}
/* ---------- GUEST ---------- */
function joinBtn(){me.name=nmVal();code=($('#rc').value||'').trim().toUpperCase();if(code.length<4){err='Enter the 4-letter room code';render();return}
  err='';busy=true;render();if(peer)try{peer.destroy()}catch(_){}peer=new Peer(undefined,PCFG);
  dbg('joining '+code);peer.on('open',id=>{dbg('reached PeerJS server');me.id=id;hc=peer.connect(PFX+code,{reliable:true});dbg('room found, opening connection');
    hc.on('iceStateChanged',st=>dbg('network: '+st));
    hc.on('open',()=>{dbg('connected to host, sent hello');hc.send({t:'hello',name:me.name,look:me.look})});
    hc.on('error',e=>{dbg('connection error: '+(e.type||e));if(S)return;busy=false;err='Found the room but could not connect to the host ('+(e.type||'error')+'). Try again.';render()});
    hc.on('data',m=>{if(m.t==='st'){dbg('got lobby from host');busy=false;S=m.s;render()}else if(m.t==='fx')fx(m);else if(m.t==='emo')floatEmo(m);else if('sp,ps,th,ct'.includes(m.t))gmsg(m);
      else if(m.t==='full'){busy=false;err=m.w==='started'?'That game has already started. Ask the host to go back to the lobby, then join.':'That room is full';S=null;render()}});
    hc.on('close',()=>{busy=false;err='Disconnected from the host';S=null;render()});
    setTimeout(()=>{if(!S&&busy){busy=false;err='Could not reach that room. Check the code and try again.';render()}},15000)});
  peer.on('error',e=>{dbg('peer error: '+e.type);busy=false;err=e.type==='peer-unavailable'?'No room with that code':'Connection problem: '+e.type;render()});
}
const tell=m=>isHost?null:hc&&hc.open&&hc.send(m);
function gmsg(m){if(m.t==='sp')onSp(m);
  else if(m.t==='ps'){for(const id in m.p)if(id!==me.id)snap(id,m.p[id])}
  else if(m.t==='th'){if(m.id!==me.id)addProj(m)}
  else if(m.t==='ct'&&S){toast('🥊 '+dn(m.a)+' caught '+dn(m.b)+'!');tone(220,300,'sawtooth')}}
function spamHit(){const m=S&&myM();if(!m||m.ph!=='spam')return;loc.sn=(loc.sn||0)+1;const e=$('#spn');if(e)e.textContent=loc.sn}
setInterval(()=>{const m=S&&S.phase==='play'&&myM();if(m&&m.ph==='spam'&&loc.sn&&loc.sn!==loc.sent){loc.sent=loc.sn;isHost?spamSet(m,me.id,loc.sn):tell({t:'spam',n:loc.sn})}},120);
function doPick(k){const m=S&&S.phase==='play'&&myM();if(!m||m.ph!=='pick'||loc.pick||m.rm.includes(k))return;loc.pick=k;tone(520,70);isHost?dpick(m,me.id,k):tell({t:'pick',k});render()}
function setTT(id){loc.tt=id;render()}
function doTroll(k,d){const t=loc.tt;if(!t)return;isHost?troll(me.id,k,t,d):tell({t:'troll',k,target:t,d});
  if(k==='mirror')toast('Mirror armed. It stays secret until the reveal');render()}
function sendEmo(e){isHost?emo(me.id,e):tell({t:'emo',e})}
function sendChat(){const i=$('#ci'),x=i.value.trim();if(!x)return;i.value='';isHost?chat(me.id,x):tell({t:'chat',x})}
const KM={w:'W',a:'A',s:'S',d:'D',arrowup:'W',arrowleft:'A',arrowdown:'S',arrowright:'D'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Shift'){KEYS.shift=1;return}
  if(e.key===' '){if(S&&S.phase==='play'&&inMatch(me.id)){e.preventDefault();if(!e.repeat)spamHit()}return}
  const k=KM[e.key.toLowerCase()];if(!k||!S||S.phase!=='play')return;e.preventDefault();if(inMatch(me.id)){if(!e.repeat)doPick(k)}else KEYS[k.toLowerCase()]=1});

/* ---------- EFFECTS ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function ov(h,ms){const d=document.createElement('div');d.className='ov';d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);return d}
function shake(){const a=$('#app');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),1200)}
let AC=null;function tone(f,ms,type){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+ms/1000)}catch(e){}}
function fx(m){if(!S)return;const T=TROLLS[m.k];toast(`${T.i} ${dn(m.from)} sent ${T.n} to ${dn(m.target)}`);if(m.target!==me.id)return;
  if(m.k==='tomato'){const w=$('#splat');for(let i=0;i<5;i++){const b=document.createElement('b');b.textContent='🍅';b.style.left=Math.random()*70+'%';b.style.top=Math.random()*75+'%';w.appendChild(b)}setTimeout(()=>w.innerHTML='',2500)}
  if(m.k==='fog'){const p=$('#pad');if(p){p.classList.add('fog');setTimeout(()=>p.classList.remove('fog'),6000)}}
  if(m.k==='horn'){tone(150,900,'sawtooth');shake()}
  if(m.k==='rush'){tone(900,200);shake();ov('⏱️ PICK NOW!',1800)}
  if(m.k==='whisper')ov('<small>A fan whispers... (could be a lie)</small>'+ARW[m.d],2400)}
function floatEmo(m){const d=document.createElement('span');d.className='fe';d.textContent=m.e;d.style.left=(8+Math.random()*80)+'%';document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}
function confetti(){const c=['#e8392f','#2f7bff','#f5c542','#f6efe0'];for(let i=0;i<150;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
function copyLink(){const l=location.origin+location.pathname+'?room='+code;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Invite link copied'),()=>prompt('Copy this invite link',l))}
